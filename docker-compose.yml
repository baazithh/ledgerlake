services:
  postgres:
    image: postgres:16
    container_name: ledgerlake-pg
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop_pw
      POSTGRES_DB: shop
    ports:
      - "5434:5432"
    command: [ "postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4" ]
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
